apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
 // Keeping for now until migration covers all files, but will warn.

// Credentials are entered on the device; never embed them in the APK.

android {
    compileSdkVersion 28
    defaultConfig {
        applicationId 'com.softbankrobotics.pepper.pepperGPT'
        minSdkVersion 23
        targetSdkVersion 28
        versionCode 91
        versionName "2.8.1"
        vectorDrawables.useSupportLibrary = true
        
    }
    
    repositories {
        maven { url "https://jitpack.io" }
    }
    
    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    splits {
        // Configures multiple APKs based on ABI.
        abi {
            enable true
            reset()
            include "x86", "armeabi-v7a"
            universalApk false
        }
    }
    buildToolsVersion '30.0.3'
}

dependencies {

    // 'libs' folder
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.9" // Compatible with Kotlin 1.3.x

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.google.android.material:material:1.1.0-alpha01'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'

    // QiSDK
    implementation 'com.aldebaran:qisdk:1.5.3'
    implementation 'com.aldebaran:qisdk-design:1.5.3'

    // RxJava
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.4'
    implementation 'com.google.firebase:firebase-crashlytics:17.2.1'
    implementation 'com.google.firebase:firebase-analytics:17.5.0'

    // Coroutines Lifecycle Scopes
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.2.0"

    // More
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.github.mwiede:jsch:0.2.11'
    implementation 'com.squareup.picasso:picasso:2.71828'

    // Tests
    testImplementation "junit:junit:4.13"
    testImplementation "org.json:json:20180813"
    testImplementation "io.mockk:mockk:1.9.3"
}
